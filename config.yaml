# ✈️ ფრენების მონიტორინგის პარამეტრები
#
# ⚠️ ფასის ზღვარი, ღამეების რაოდენობა და პაუზა შეგიძლია ტელეფონიდანაც შეცვალო
# (ntfy-ის settings თემით — იხ. README). ტელეფონიდან დაყენებული მნიშვნელობა
# უპირატესია აქ მითითებულზე. აქ არის მხოლოდ საწყისი (default) მნიშვნელობები.

# საიდან ვფრინავთ / სად ვბრუნდებით (ნებისმიერი კომბინაცია: TBS→X→KUT და ა.შ.)
origins: [TBS, KUT]

# რამდენი დღე წინ შევამოწმოთ
days_ahead: 183          # ~6 თვე

defaults:
  max_price_gel: 220     # წასვლა+დაბრუნების ჯამური ფასი ლარში
  min_nights: 3          # მინიმუმ 3 ღამე (მაგ. 5-ში წასვლა, 8-ში დაბრუნება)
  max_nights: 7          # მაქსიმუმ 7 ღამე
  max_transfers: 1       # თითო მიმართულებაზე მაქსიმუმ 1 გადაჯდომა (0 = მხოლოდ პირდაპირი)
  quiet_from: 0          # მშვიდი საათები (თბილისის დროით): 00:00-დან...
  quiet_to: 9            # ...09:00-მდე შეტყობინებები არ მოდის; ნაპოვნი ფრენები დილით მოვა

notifications:
  max_per_run: 5               # ერთ შემოწმებაზე მაქსიმუმ რამდენი ცალკე შეტყობინება
  renotify_drop_percent: 10    # იგივე მიმართულებაზე ხელახლა შეგატყობინებს, თუ ფასი ≥10%-ით დაიწია
  renotify_after_days: 7       # ...ან თუ ბოლო შეტყობინებიდან 7 დღე გავიდა
  urgent_below_percent: 70     # თუ ფასი ზღვრის 70%-ზე ნაკლებია → მაღალი პრიორიტეტი

sources:
  travelpayouts:
    enabled: true              # საჭიროა TRAVELPAYOUTS_TOKEN (GitHub Secret)
    currency: eur
    per_route: true            # თითოეულ მარშრუტზე ცალკე ძებნა (ყველა ავიაკომპანია, ყველა თარიღი)
    max_routes: 200
  wizzair:
    enabled: true
    window_days: 42            # ერთ მოთხოვნაში რამდენი დღე
    request_delay_seconds: 1.0 # პაუზა მოთხოვნებს შორის, რომ არ დაგვბლოკონ
    fallback_api_version: ""   # თუ buildnumber ვერ მოიძებნა, მაგ. "27.6.0"

# თუ ეროვნული ბანკის კურსი ვერ ჩამოიტვირთა, გამოიყენება ეს (1 ერთეული = X ლარი)
fallback_rates_gel:
  EUR: 3.15
  USD: 2.70
  GBP: 3.60
  PLN: 0.74
  HUF: 0.0080
  RON: 0.63
  CZK: 0.125
  TRY: 0.065
  AED: 0.74
  ILS: 0.73
