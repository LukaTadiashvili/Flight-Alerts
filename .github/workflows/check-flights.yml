name: Check cheap flights

on:
  schedule:
    # Twice a day. Times are UTC; Georgia is UTC+4.
    - cron: "17 5 * * *"     # 09:17 Tbilisi  — main morning check
    - cron: "17 17 * * *"    # 21:17 Tbilisi  — main evening check
    # Backups: GitHub sometimes skips scheduled runs. These only search if the
    # main check did not happen (no successful check in the last 6 hours).
    - cron: "47 7 * * *"     # 11:47 Tbilisi
    - cron: "47 19 * * *"    # 23:47 Tbilisi
  workflow_dispatch: {}      # "Run workflow" button for a manual check
  push:
    branches: [main]
    paths: ["web/**"]        # redeploy the app when its code changes

permissions:
  contents: write            # push the `data` branch (state + price history)
  pages: write               # publish the web app
  id-token: write

concurrency:
  group: flight-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore data from the `data` branch
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data; then
            git archive FETCH_HEAD | tar -x -C data
            ls -la data
          else
            echo "No data branch yet — first run"
          fi

      - name: Decide whether to search
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          search = os.environ["EVENT"] != "push"
          if os.environ["EVENT"] == "schedule" and os.environ["CRON"].startswith("47 "):
              try:
                  at = json.load(open("data/state.json"))["last_run"]["at"]
                  age = datetime.now(timezone.utc) - datetime.fromisoformat(at)
                  search = age > timedelta(hours=6)
                  print(f"Backup run: last check {age} ago → search={search}")
              except Exception as exc:
                  print("No previous check found:", exc)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"search={'true' if search else 'false'}\n")
          PY

      - name: Search flights and notify
        if: steps.decide.outputs.search == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          DATA_DIR: data
        run: python -m flight_alerts

      - name: Save data to the `data` branch
        if: always() && steps.decide.outputs.search == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd data
          git init -q -b data
          git config user.name "flight-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Flight data $(date -u +%Y-%m-%dT%H:%MZ)"
          # single-commit branch, overwritten every run → the repository never grows
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Build site
        if: github.event_name == 'push' || steps.decide.outputs.search == 'true'
        run: |
          mkdir -p site/data
          cp -r web/. site/
          cp data/flights.json data/history.json site/data/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || steps.decide.outputs.search == 'true'
        continue-on-error: true
        with:
          path: site

      - id: deploy
        if: github.event_name == 'push' || steps.decide.outputs.search == 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true   # notifications keep working even if Pages isn't enabled yet

  tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest && python -m pytest -q
